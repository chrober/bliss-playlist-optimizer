name: Build ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-arm64.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"

jobs:
  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install pinned cross toolchain
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cross.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  $archive" \
            | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build release binary
        run: cross build --release --locked --target aarch64-unknown-linux-gnu
      - name: Verify binary architecture
        run: file target/aarch64-unknown-linux-gnu/release/bliss-playlist-optimizer
      - uses: actions/upload-artifact@v4
        with:
          name: bliss-playlist-optimizer-aarch64-linux
          path: target/aarch64-unknown-linux-gnu/release/bliss-playlist-optimizer
          if-no-files-found: error
