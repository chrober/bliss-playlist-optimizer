name: Publish optimizer binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optimizer release version. Empty reads Cargo.toml package.version."
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as prerelease."
        required: true
        default: "false"
      dry_run:
        description: "Build and upload workflow artifacts only; do not create a GitHub release."
        required: true
        default: "false"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: python tests/test_source_archive.py
      - run: python tests/test_license_bundle.py

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: bliss-playlist-optimizer-x86_64-linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bliss-playlist-optimizer
            cross: false
          - asset: bliss-playlist-optimizer-aarch64-linux
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: bliss-playlist-optimizer
            cross: true
          - asset: bliss-playlist-optimizer-armhf-linux
            runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            binary: bliss-playlist-optimizer
            cross: true
          - asset: bliss-playlist-optimizer-mac
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: bliss-playlist-optimizer
            cross: false
          - asset: bliss-playlist-optimizer-windows.exe
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bliss-playlist-optimizer.exe
            cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install pinned cross toolchain
        if: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cross.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          echo "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad  $archive" \
            | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          if [ "$USE_CROSS" = "true" ]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi

      - name: Stage release asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/$BINARY" "dist/$ASSET"
          if [[ "$ASSET" != *.exe ]]; then
            chmod 0755 "dist/$ASSET"
          fi
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          ls -l dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  source:
    name: Build vendored source snapshot
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Capture the same source commit and locked dependencies
        run: |
          set -euo pipefail
          mkdir -p source-assets
          python scripts/build_source_archive.py --repo . --commit "$GITHUB_SHA" --output source-assets/bliss-playlist-optimizer-source.tar.gz
          python scripts/build_license_bundle.py source-assets/bliss-playlist-optimizer-source.tar.gz source-assets/bliss-playlist-optimizer-third-party-licenses.zip
          cp third-party-licenses/nugine-simd-0.8.0-LICENSE source-assets/bliss-playlist-optimizer-third-party-nugine-LICENSE
          (cd source-assets && sha256sum bliss-playlist-optimizer-source.tar.gz > bliss-playlist-optimizer-source.tar.gz.sha256)
          (cd source-assets && sha256sum bliss-playlist-optimizer-third-party-licenses.zip > bliss-playlist-optimizer-third-party-licenses.zip.sha256)
          (cd source-assets && sha256sum bliss-playlist-optimizer-third-party-nugine-LICENSE > bliss-playlist-optimizer-third-party-nugine-LICENSE.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: bliss-playlist-optimizer-source
          path: source-assets/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build, source]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release metadata
        id: meta
        env:
          VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])')"
            fi
          fi
          if [ -z "$version" ]; then
            echo "Could not determine optimizer version" >&2
            exit 1
          fi
          tag="v${version#v}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: bliss-playlist-optimizer-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          notes="release-notes.md"
          {
            echo "# bliss-playlist-optimizer $VERSION"
            echo
            echo "Native binaries for Better Call Bliss and other playlist-optimization consumers."
            echo
            echo "Built from commit $GITHUB_SHA after fmt, clippy, and test gates."
            echo
            echo "[Source archive](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/bliss-playlist-optimizer-source.tar.gz) (see \`SOURCE_ARCHIVE_README.txt\` inside) · [Third-party licenses](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/bliss-playlist-optimizer-third-party-licenses.zip). SHA-256 files are available with the assets."
          } > "$notes"

          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi

          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA" || { echo 'Release tag points to a different source commit' >&2; exit 1; }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG; refusing to overwrite assets" >&2; exit 1
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "bliss-playlist-optimizer $VERSION" \
              --notes-file "$notes" \
              "${prerelease_flag[@]}"
          fi
